# Cấu hình Video Studio Local. Đường dẫn tương đối tính từ thư mục gốc project.

outputs_dir: outputs

# auto: offline (không hỏi Hugging Face khi nạp model → nạp nhanh, chạy được khi mất mạng) nếu model đã có
# trong cache; chưa có thì để online cho lần đầu tự tải. true / false: ép luôn offline / online.
hf_offline: auto

video:
  aspect_ratio: "16:9"          # "16:9" hoặc "9:16"
  resolutions:                  # phải chia hết cho 16 (yêu cầu của FLUX)
    "16:9": [1280, 720]
    "9:16": [720, 1280]
  fps: 30

scenes:
  min_sec: 8                    # hướng 1 (whiteboard-stream-animation): 8–20 s/cảnh
  max_sec: 20


llm:
  host: http://127.0.0.1:11434  # Ollama
  model: hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
  temperature: 0.3
  num_ctx: 16384                # độ dài ngữ cảnh (token) — đủ cho kịch bản ~5000 từ + JSON trả về
  use_mmap: true                # BẮT BUỘC trên máy này: không có thì Ollama cấp 17.8GB pinned RAM → lỗi
                                # "failed to allocate CUDA_Host buffer" (commit limit chỉ 34GB)
  max_retries: 2                # số lần thử lại khi JSON sai định dạng
  chunk_words: 600              # kịch bản dài được chia thành các phần ~600 tiếng, mỗi phần gọi LLM một lần
  timeout_sec: 900

images:
  backend: flux                 # flux | placeholder (ảnh giả để test không cần GPU)
  model: hlhc/FLUX.2-klein-4B-bnb-4bit
  steps: 4                      # model distilled: ~4 bước
  guidance_scale: 1.0
  seed: 42
  cpu_offload: true             # true: đỉnh ~2.8GB VRAM, 7.3s/ảnh | false: ~6.6GB, 11.6s/ảnh (tràn VRAM)
  # Không viết "no text": model khuếch tán hiểu phủ định kém, nhắc tới "text" lại dễ sinh chữ
  style_suffix: >-
    , wordless illustration made only of simple shapes, icons and arrows,
    black line art on a plain white background, clean bold outlines,
    whiteboard sketch style, minimal shading

# ── Ngôn ngữ ────────────────────────────────────────────────────────────────
# Thêm ngôn ngữ mới = thêm một mục ở đây + một engine TTS (tts_engines) đọc được ngôn ngữ đó.
languages:
  vi:
    name: Tiếng Việt
    llm_name: Vietnamese        # tên ngôn ngữ trong prompt gửi LLM
    tts: vieneu
    voice: "Thiện Minh"         # xem: python tests/test_tts.py --list-voices
    units_per_sec: 4.5          # tốc độ đọc (tiếng/giây, đo từ VieNeu) → ước lượng giây khi đang gõ
    subtitle_max_words: 12      # tối đa ~12 tiếng mỗi dòng phụ đề (9:16 tự giảm 1/3)
  en:
    name: English
    llm_name: English
    tts: kokoro
    voice: am_michael           # giọng Kokoro: am_* nam Mỹ, af_* nữ Mỹ, bm_*/bf_* Anh
    tts_lang: en-us             # mã ngôn ngữ cho Kokoro (en-us / en-gb)
    units_per_sec: 2.7          # từ/giây
    subtitle_max_words: 9

default_source_lang: vi         # ngôn ngữ gốc của dự án mới
default_target_langs: [en]      # ngôn ngữ dịch sẵn cho dự án mới (để trống [] = chỉ ngôn ngữ gốc)

tts_engines:                    # engine TTS theo tên — mỗi ngôn ngữ chọn một engine ở trên
  vieneu:                       # VieNeu-TTS v3 Turbo, ONNX trên CPU (tiếng Việt)
    precision: int8             # int8 (nhanh hơn ~30%) | fp32 (chất lượng tối đa)
    temperature: 0.8
  kokoro:                       # Kokoro-82M ONNX int8 (Apache-2.0), tiếng Anh; tải bằng tools/download_models.py
    model_path: models/kokoro/kokoro-v1.0.int8.onnx
    voices_path: models/kokoro/voices-v1.0.bin
    speed: 1.0

translate:
  temperature: 0.2
  chunk_scenes: 12              # dịch tối đa bấy nhiêu cảnh mỗi lần gọi LLM
  length_ratio: [0.4, 2.2]      # bản dịch có số từ/số tiếng gốc ngoài khoảng này → coi là dịch hỏng, thử lại

whiteboard:
  # stream  = hướng 1 (whiteboard-stream-animation): vẽ cả ảnh một lượt, giữ hình 3s cuối
  # regions = hướng 2 (srt-whiteboard-animation): vẽ từng vùng khớp từng câu đang đọc (annotation tự sinh)
  engine: stream
  repo_dir: third_party/whiteboard-stream-animation
  regions_repo_dir: third_party/srt-whiteboard-animation
  max_regions: 3                # hướng 2: số vùng tối đa mỗi cảnh (≈ số nhóm câu)
  tail_ms: 600                  # giữ hình thêm sau khi hết lời đọc
  min_clip_ms: 6000             # repo luôn dành 3s cuối để giữ hình → clip ngắn hơn thì không còn thời gian vẽ
  pen_image: assets/drawing-hand-clean.png   # bàn tay đã xoá chữ trên bút (tools/clean_pen_image.py); để trống = ảnh gốc
  extra_args: ["--pause", "light"]

render:
  engine: remotion              # remotion: tiêu đề + chuyển cảnh + phụ đề đẹp | ffmpeg: ghép thẳng, nhanh hơn
                                # (chưa cài remotion/node_modules thì tự dùng ffmpeg)
  audio_bitrate: 192k

remotion:
  title: true                   # mặc định cho dự án mới: màn hình tiêu đề (tên dự án) ở đầu video
  title_sec: 3.0
  title_subtitle: ""            # dòng chữ nhỏ dưới tiêu đề (để trống = không có)
  title_font: Segoe Print       # font viết tay có sẵn trên Windows
  transition_sec: 0.4           # chuyển cảnh mờ dần; phải < whiteboard.tail_ms để giọng 2 cảnh không đè nhau
  background: "#F6F1E3"         # trùng màu giấy của repo vẽ bảng
  concurrency: 6                # số khung hình Remotion vẽ song song (máy 12 luồng CPU)

shorts:                         # "Tạo Shorts từ video dài" (bước 4 của dự án dài)
  min_sec: 30                   # độ dài một Short (chưa tính câu kết)
  max_sec: 60
  count: 4                      # số đề xuất muốn LLM đưa ra (3–5)
  max_scenes: 4                 # tối đa bấy nhiêu cảnh liền nhau mỗi Short
  title_font_ratio: 0.072       # cỡ chữ tiêu đề = 7.2% bề ngang khung dọc (52px ở 720)
  subtitle_font_ratio: 0.07     # phụ đề LỚN (50px ở 720)
  subtitle_max_words: {vi: 6, en: 5}   # ít chữ mỗi lần hiện → đọc kịp trên điện thoại
  outro_min_sec: 3.0            # màn hình kết tối thiểu (dài hơn nếu câu kết đọc lâu hơn)
  cta:                          # câu kết theo ngôn ngữ; {title} = tiêu đề video đầy đủ
    vi: "Muốn biết đầy đủ? Xem video «{title}» trên kênh nhé!"
    en: "Want the full story? Watch «{title}» on the channel!"

music:                          # nhạc nền (mỗi dự án tải file riêng ở bước 4)
  volume: 0.15                  # âm lượng mặc định (0–1) so với giọng đọc
  duck: true                    # tự giảm nhạc khi có giọng đọc
  duck_level: 0.35              # lúc có giọng, nhạc còn 35% âm lượng đã chọn
  duck_ramp_sec: 0.4            # thời gian nhạc nhỏ dần / to dần quanh giọng đọc
  fade_in_sec: 1.0
  fade_out_sec: 2.5
  max_upload_mb: 50

subtitles:
  enabled: true                # mặc định cho dự án mới (mỗi dự án bật/tắt riêng ở bước 4)
  font: Arial                   # font có đủ dấu tiếng Việt
  fonts_dir: C:/Windows/Fonts   # nơi libass tìm font
  font_size_ratio: 0.05         # cỡ chữ = 5% chiều cao video (36px ở 720p)
  max_words: 12                 # tối đa ~12 tiếng mỗi dòng phụ đề (9:16 tự giảm còn 8)
